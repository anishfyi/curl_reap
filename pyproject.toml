[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curl_reap"
version = "1.1.0"
description = "Reap the web: ordered HTTP transport, self-healing selectors, structured extraction, and a concurrent crawl engine in one library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anish", email = "anishfyi@gmail.com" }]
keywords = ["scraping", "crawler", "http", "tls", "selectors", "lxml", "spider"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "lxml>=5.0",
  "cssselect>=1.2",
]

[project.optional-dependencies]
js = ["playwright>=1.40"]
h2 = ["h2>=4.0,<5"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
reap = "curl_reap.cli:main"

[project.urls]
Homepage = "https://velofy.co/curl_reap/"
Documentation = "https://velofy.co/curl_reap/"
Repository = "https://github.com/anishfyi/curl_reap"
Issues = "https://github.com/anishfyi/curl_reap/issues"

[tool.hatch.build.targets.wheel]
packages = ["curl_reap"]

[tool.hatch.build.targets.sdist]
include = ["curl_reap", "README.md", "LICENSE", "assets/logo.svg"]
