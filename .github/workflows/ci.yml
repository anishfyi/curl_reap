name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Prove curl_cffi is gone
        run: |
          ! grep -rn "curl_cffi" curl_reap/
          python -c "import curl_reap; assert 'curl_cffi' not in curl_reap.__doc__"
      - name: Test
        run: python -m pytest tests/ -q
